<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KHALIF-BUS Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 23px;
    }

    .logout {
      background: #ef4444;
      border: none;
      color: white;
      padding: 10px 15px;
      border-radius: 7px;
      cursor: pointer;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .stat h3 {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat p {
      font-size: 26px;
      font-weight: bold;
    }

    .orders {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .orders-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .clear {
      background: #ef4444;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 7px;
      cursor: pointer;
    }

    .order {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .order-id {
      font-weight: bold;
      color: #2563eb;
    }

    .customer {
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .items {
      background: #f9fafb;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .total {
      font-size: 19px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      padding: 50px 10px;
      color: #6b7280;
    }

    .login {
      max-width: 400px;
      margin: 100px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,.1);
    }

    .login h2 {
      margin-bottom: 20px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0 15px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    .login button {
      width: 100%;
      padding: 13px;
      background: #111827;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .error {
      color: #dc2626;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>

<body>

<div id="loginPage">

  <div class="login">

    <h2>🔐 KHALIF-BUS Admin</h2>

    <input
      type="password"
      id="password"
      placeholder="Admin password"
    >

    <button onclick="login()">
      Login
    </button>

    <p id="error" class="error"></p>

  </div>

</div>


<div id="dashboard" style="display:none;">

  <header>

    <h1>🚀 KHALIF-BUS ADMIN</h1>

    <button class="logout" onclick="logout()">
      Logout
    </button>

  </header>


  <div class="container">

    <div class="stats">

      <div class="stat">
        <h3>Total Orders</h3>
        <p id="totalOrders">0</p>
      </div>

      <div class="stat">
        <h3>Total Sales</h3>
        <p>KSh <span id="totalSales">0</span></p>
      </div>

      <div class="stat">
        <h3>Products Sold</h3>
        <p id="productsSold">0</p>
      </div>

    </div>


    <div class="orders">

      <div class="orders-header">

        <h2>Customer Orders</h2>

        <button class="clear" onclick="clearOrders()">
          Clear Orders
        </button>

      </div>

      <div id="ordersList"></div>

    </div>

  </div>

</div>


<script>

  /*
    DEMO ADMIN PASSWORD

    Change this before testing.
    This is NOT secure for a real business.
  */

  const ADMIN_PASSWORD = "KHALIF2026";


  function login() {

    const password =
      document.getElementById("password").value;

    if (password === ADMIN_PASSWORD) {

      sessionStorage.setItem(
        "khalifAdmin",
        "true"
      );

      showDashboard();

    } else {

      document.getElementById("error").textContent =
        "Incorrect password.";

    }

  }


  function showDashboard() {

    document.getElementById("loginPage").style.display =
      "none";

    document.getElementById("dashboard").style.display =
      "block";

    loadOrders();

  }


  function logout() {

    sessionStorage.removeItem("khalifAdmin");

    location.reload();

  }


  function loadOrders() {

    const orders =
      JSON.parse(
        localStorage.getItem("khalifOrders")
      ) || [];


    const ordersList =
      document.getElementById("ordersList");


    let sales = 0;

    let products = 0;


    orders.forEach(order => {

      sales += Number(order.total) || 0;


      if (order.items) {

        order.items.forEach(item => {

          products += Number(item.quantity) || 0;

        });

      }

    });


    document.getElementById("totalOrders")
      .textContent = orders.length;


    document.getElementById("totalSales")
      .textContent = sales.toLocaleString();


    document.getElementById("productsSold")
      .textContent = products;


    ordersList.innerHTML = "";


    if (orders.length === 0) {

      ordersList.innerHTML = `
        <div class="empty">
          <h3>No orders yet</h3>
          <p>Customer orders will appear here.</p>
        </div>
      `;

      return;

    }


    orders
      .slice()
      .reverse()
      .forEach(order => {

        const div =
          document.createElement("div");

        div.className = "order";


        let itemsHTML = "";


        if (order.items) {

          order.items.forEach(item => {

            itemsHTML += `
              <div>
                ${escapeHTML(item.name)}
                × ${item.quantity}
                — KSh
                ${(item.price * item.quantity)
                  .toLocaleString()}
              </div>
            `;

          });

        }


        div.innerHTML = `

          <div class="order-top">

            <span class="order-id">
              ${escapeHTML(order.orderId)}
            </span>

            <span>
              ${escapeHTML(order.date || "")}
            </span>

          </div>


          <div class="customer">

            <strong>Customer</strong><br>

            Name:
            ${escapeHTML(order.customer || "")}
            <br>

            Phone:
            ${escapeHTML(order.phone || "")}
            <br>

            Location:
            ${escapeHTML(order.location || "")}

          </div>


          <div class="items">

            <strong>Products</strong>

            <br><br>

            ${itemsHTML}

          </div>


          <div class="total">

            Total:
            KSh ${(Number(order.total) || 0)
              .toLocaleString()}

          </div>

        `;


        ordersList.appendChild(div);

      });

  }


  function clearOrders() {

    const answer =
      confirm(
        "Delete all orders stored on this device?"
      );


    if (answer) {

      localStorage.removeItem(
        "khalifOrders"
      );

      loadOrders();

    }

  }


  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  if (
    sessionStorage.getItem("khalifAdmin") === "true"
  ) {

    showDashboard();

  }

</script>

</body>
</html>
